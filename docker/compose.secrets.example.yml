# An example for Docker Compose with tokens of your own (docs/reference/container.md#managed-secrets):
# the REST service and the MCP server on 127.0.0.1:3333, data read-only, reports in a volume, tokens as
# secrets (not environment variables, which `docker inspect` shows; the files must be readable by the
# user 10001: chown 10001 secrets/* and chmod 0400; docs/reference/container.md#managed-secrets also
# shows "create": true, which lets the server make the files in its volume), made with
#   docker run --rm ghcr.io/eizedev/pivotkit:<version> token new > secrets/pivotkit_token
# The configuration is pivotkit.secrets.example.json, mounted as /config/pivotkit.json; the download
# links' key is made at the first start in the volume pivotkit. Set PIVOTKIT_VERSION to a release of
# pivotkit-server.
services:
  pivotkit:
    image: ghcr.io/eizedev/pivotkit:${PIVOTKIT_VERSION:?set PIVOTKIT_VERSION to a pivotkit-server release, e.g. 0.3.2}
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    ports: ["127.0.0.1:3333:3333"]
    volumes:
      - ./data:/data:ro
      - ./pivotkit.json:/config/pivotkit.json:ro
      - pivotkit-out:/out
      - pivotkit:/var/lib/pivotkit
    secrets: [pivotkit_token, pivotkit_export_token]
    stop_grace_period: 30s
    # the log is JSON lines on stderr (the image sets PIVOTKIT_LOG_FORMAT=json): keep it bounded
    # locally, or send it to a log server with one of the commented drivers instead
    # (docs/reference/operations.md); map pivotkit's own "level" there, not the driver's
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    # logging:
    #   driver: gelf
    #   options:
    #     gelf-address: "udp://graylog.example.com:12201"
    #     tag: "pivotkit"
    # logging:
    #   driver: syslog
    #   options:
    #     syslog-address: "tcp+tls://logs.example.com:6514"
    #     syslog-format: "rfc5424"
    #     tag: "pivotkit"

volumes:
  pivotkit-out: {}
  pivotkit: {}

secrets:
  pivotkit_token:
    file: ./secrets/pivotkit_token
  pivotkit_export_token:
    file: ./secrets/pivotkit_export_token
