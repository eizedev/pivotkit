# An example for Docker Compose (docs/getting-started/server-in-5-minutes.md): the REST service and the
# MCP server on 127.0.0.1:3333, data read-only, the token and keys the server makes at its first start
# and the reports in the volume pivotkit. Read the token with:
#   docker compose exec pivotkit pivotkit-server token show admin
# Tokens of your own as secret files instead: compose.secrets.example.yml. Set PIVOTKIT_VERSION to a
# release of pivotkit-server.
services:
  pivotkit:
    image: ghcr.io/eizedev/pivotkit:${PIVOTKIT_VERSION:?set PIVOTKIT_VERSION to a pivotkit-server release, e.g. 0.3.1}
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    ports: ["127.0.0.1:3333:3333"]
    volumes:
      - ./data:/data:ro
      - ./pivotkit.json:/config/pivotkit.json:ro
      - pivotkit:/var/lib/pivotkit
    stop_grace_period: 30s
    # the log is JSON lines on stderr (the image sets PIVOTKIT_LOG_FORMAT=json): keep it bounded
    # locally, or send it to a log server (docs/reference/operations.md, compose.secrets.example.yml)
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pivotkit: {}
