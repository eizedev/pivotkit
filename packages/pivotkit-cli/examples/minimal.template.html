<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="pivotkit">
<meta name="description" content="{{summary}}">
<title>{{title}}</title>
{{style}}
<style>
/*
 * Minimal: a pivotkit print template to copy and adapt (https://pivotkit.eize.dev/reference/corporate-design/).
 * The title, the chart, the table and the details, nothing else. It follows the reader's system theme
 * (light or dark on a screen, light on paper) and sets no colour of its own: the report's tokens
 * read in both.
 */
.pk-report {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px;
}
.pk-report h1 {
    margin-bottom: 16px;
}
@media print {
    .pk-report {
        padding: 0;
    }
}
</style>
</head>
<body>
<main class="pk-report">
<h1>{{title}}</h1>
{{chart}}
{{table}}
{{details}}
</main>
</body>
</html>
