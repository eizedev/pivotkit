name: Container image

# The container image ghcr.io/eizedev/pivotkit (docker/Dockerfile): the REST service, the MCP server
# and the command line. Every pull request that touches what goes into it builds it for linux/amd64
# and runs it as an operator would (read-only, non-root, no capabilities): started without any
# configuration (the token made at the first start), with tokens from secret files, and with the
# Compose example; nothing is pushed. A tag pivotkit-server@<version> builds it for linux/amd64 and
# linux/arm64, pushes it to ghcr as <version>, <major>.<minor> and latest (metadata-action's default)
# with a provenance and an SBOM attestation, and signs it with cosign (keyless, the workflow's OIDC
# identity). The push happens when the tag is pushed and does not wait for the npm approval of
# release.yml. It runs only while the repository variable IMAGE_RELEASE_ENABLED is "true". See
# RELEASING.md.
on:
  # every base branch: a pull request stacked on another one is tested too
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "packages/**"
      - "package-lock.json"
      - "scripts/examples.js"
      - "scripts/is-main.js"
      - "scripts/third-party-licenses.js"
      - "examples/playground/data/**"
      - "examples/report-templates/**"
      - ".github/workflows/image.yml"
  push:
    tags: ["pivotkit-server@*"]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/eizedev/pivotkit

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: pivotkit:test
      - name: The image's size
        # in bytes, unpacked, on the job's log: what a change adds to the image shows in its pull request
        run: docker image inspect --format '{{.Size}}' pivotkit:test
      - name: The command on the PATH
        # distroless has no shell and no /usr/bin/env: the launcher names /nodejs/bin/node
        run: |
          set -eu
          docker run --rm --entrypoint /nodejs/bin/node pivotkit:test -e "process.exit(require('fs').existsSync('/usr/bin/env') ? 1 : 0)"
          docker inspect --format '{{json .Config.Env}}' pivotkit:test | grep -q '/usr/local/bin'
          docker run --rm --entrypoint pivotkit-server pivotkit:test --version | grep -q '^pivotkit-server '
          docker run --rm --entrypoint pivotkit-server pivotkit:test token new | grep -Eq '^[A-Za-z0-9_-]{43}$'
          # the state directory: the image's user's only
          docker run --rm --entrypoint /nodejs/bin/node pivotkit:test -e "const s=require('fs').statSync('/var/lib/pivotkit');if((s.mode&0o777)!==0o700||s.uid!==10001)process.exit(1)"
      - name: First start without any configuration
        # the built-in example configuration; the token "admin" and the download key made in the
        # state volume; read with token show; the same after a restart; never on the log
        run: |
          set -eu
          wait_healthy() {
            for i in $(seq 1 30); do
              test "$(docker inspect --format '{{.State.Health.Status}}' "$1")" = "healthy" && return 0
              sleep 2
            done
            docker logs "$1"; return 1
          }
          docker volume create pk-state
          docker run -d --name pk --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:3334:3333 -v pk-state:/var/lib/pivotkit pivotkit:test
          wait_healthy pk
          token="$(docker exec pk pivotkit-server token show admin)"
          test "${#token}" -eq 43
          api=http://localhost:3334/api/v1
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/sources")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $token" "$api/sources")" = "200"
          curl -fsS -H "authorization: Bearer $token" "$api/sources" | grep -q '"id":"example"'
          curl -fsS -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"source":"example","view":{"rows":["Region"],"values":[{"field":"Revenue","agg":"sum"}]},"format":"xlsx"}' \
            "$api/views/render" | grep -q '"ok":true'
          # the request of docs/getting-started/server-in-5-minutes.md
          curl -fsS -H "authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"source":"example","view":{"rows":["Region"],"values":[{"field":"Revenue","agg":"sum"}]},"format":"csv"}' \
            "$api/views/render/file" | grep -q '^West,'
          mcp=http://localhost:3334/mcp
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d "$init" "$mcp")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "authorization: Bearer $token" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d "$init" "$mcp")" = "200"
          docker logs pk 2>&1 | grep -q 'created the token \\"admin\\"'
          docker logs pk 2>&1 | grep -q 'read it with: docker exec'
          if docker logs pk 2>&1 | grep -qF -- "$token"; then echo "the token is on the log"; exit 1; fi
          # the token's file: 0600, the image's user's
          docker run --rm -v pk-state:/state --entrypoint /nodejs/bin/node pivotkit:test -e "const fs=require('fs');const f=fs.statSync('/state/secrets/admin.token');const d=fs.statSync('/state/secrets');if((f.mode&0o777)!==0o600||f.uid!==10001||(d.mode&0o777)!==0o700)process.exit(1)"
          # a restart keeps it
          docker restart pk
          wait_healthy pk
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $token" "$api/sources")" = "200"
          test "$(docker exec pk pivotkit-server token show admin)" = "$token"
          if docker logs pk 2>&1 | grep -c 'created the token' | grep -qv '^1$'; then echo "made twice"; exit 1; fi
          docker rm -f pk
          # two containers starting on one new volume get one token, and both take it
          docker volume create pk-race
          for n in r1 r2; do docker run -d --name "$n" --read-only --tmpfs /tmp -v pk-race:/var/lib/pivotkit pivotkit:test; done
          wait_healthy r1
          wait_healthy r2
          raced="$(docker exec r1 pivotkit-server token show admin)"
          test "$(docker exec r2 pivotkit-server token show admin)" = "$raced"
          # the token goes through the environment: as an argument, one that starts with "-" is a node option
          for n in r1 r2; do
            docker exec -e PK_TOKEN="$raced" "$n" /nodejs/bin/node -e "fetch('http://127.0.0.1:3333/api/v1/sources',{headers:{authorization:'Bearer '+process.env.PK_TOKEN}}).then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))"
          done
          docker rm -f r1 r2
      - name: What a start refuses
        run: |
          set -eu
          # the containers this step starts are removed however it ends
          trap 'docker rm -f pk-ro-out pk-layer > /dev/null 2>&1 || true' EXIT
          # waits for a container's "started" line; fails with its log when it never comes
          wait_started() {
            for i in $(seq 1 30); do docker logs "$1" 2>&1 | grep -q '"started"' && return 0; sleep 1; done
            echo "::error::$1 did not start within 30 seconds"; docker logs "$1"; return 1
          }
          work="$RUNNER_TEMP/refused"
          mkdir -p "$work/stray" "$work/explicit"
          # without a configuration and without a state directory: auth none on every address is refused
          if docker run --rm -e PIVOTKIT_STATE_DIR= -e PIVOTKIT_CONFIG= pivotkit:test 2> "$work/open.txt"; then exit 1; fi
          grep -q "needs --auth token or oauth" "$work/open.txt"
          # read-only without a state volume: no token can be made, the start names the volume and never listens
          if docker run --rm --read-only --tmpfs /tmp pivotkit:test 2> "$work/ro.txt"; then exit 1; fi
          grep -q "mount a writable volume at /var/lib/pivotkit" "$work/ro.txt"
          if grep -q '"started"' "$work/ro.txt"; then exit 1; fi
          # a /config with a misnamed file is not served as the example: the file is named
          echo '{}' > "$work/stray/pivotkit.jsn"
          if docker run --rm -v "$work/stray:/config:ro" -v pk-state:/var/lib/pivotkit pivotkit:test 2> "$work/stray.txt"; then exit 1; fi
          grep -q "pivotkit.jsn" "$work/stray.txt"
          # a token file without create: true is never made
          echo '{"auth":{"mode":"token","tokens":[{"name":"mine","file":"/var/lib/pivotkit/mine.token"}]}}' > "$work/explicit/pivotkit.json"
          chmod 0644 "$work/explicit/pivotkit.json"
          if docker run --rm -v "$work/explicit:/config:ro" -v pk-state:/var/lib/pivotkit pivotkit:test 2> "$work/explicit.txt"; then exit 1; fi
          grep -q 'the token \\"mine\\"' "$work/explicit.txt"
          docker run --rm -v pk-state:/state --entrypoint /nodejs/bin/node pivotkit:test -e "process.exit(require('fs').existsSync('/state/mine.token') ? 1 : 0)"
          # read-only, output.dir /out and no volume there (the image declares none): it starts and says to mount one
          mkdir -p "$work/ro-out"
          echo '{"output":{"dir":"/out"}}' > "$work/ro-out/pivotkit.json"
          chmod 0644 "$work/ro-out/pivotkit.json"
          docker run -d --name pk-ro-out --read-only --tmpfs /tmp -v "$work/ro-out:/config:ro" -v pk-state:/var/lib/pivotkit pivotkit:test
          wait_started pk-ro-out
          docker logs pk-ro-out 2>&1 | grep -q "read-only file system" || { echo "::error::no read-only warning for output.dir"; docker logs pk-ro-out; exit 1; }
          docker logs pk-ro-out 2>&1 | grep -q "mount a writable volume at output.dir"
          docker rm -f pk-ro-out
          # without --read-only and without a volume the state lies on the container's layer: a warning
          docker run -d --name pk-layer pivotkit:test
          wait_started pk-layer
          docker logs pk-layer 2>&1 | grep -q "lost when the container is removed" || { echo "::error::no container-layer warning"; docker logs pk-layer; exit 1; }
          docker rm -f pk-layer
      - name: The viewer page with pivotkit-element's files
        # the image holds pivotkit-element's built files, so the viewer page (rest.browser.viewer) answers
        # 200, not 503, and serves them. Its issuer is never reached: the page and its files need none
        # before the sign-in. The keys are made in the state volume; the requests keep the public host
        run: |
          set -eu
          trap 'docker rm -f pk-viewer > /dev/null 2>&1 || true' EXIT
          work="$RUNNER_TEMP/viewer"
          mkdir -p "$work"
          cat > "$work/pivotkit.json" <<'JSON'
          {
            "sources": { "example": { "file": "/app/examples/sales.csv", "link": "https://reports.example.com/live/example" } },
            "auth": { "mode": "oauth", "issuer": "https://login.example.invalid/realms/example", "resource": "https://reports.example.com/mcp" },
            "output": { "downloads": { "signIn": { "clientId": "pivotkit-web", "scopes": ["openid"] } } },
            "rest": { "browser": { "viewer": true } },
            "http": { "publicUrl": "https://reports.example.com" }
          }
          JSON
          chmod 0644 "$work/pivotkit.json"
          docker run -d --name pk-viewer --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:3335:3333 -v "$work:/config:ro" -v pk-viewer-state:/var/lib/pivotkit pivotkit:test
          live=http://localhost:3335/live
          get() { curl -s -o /dev/null -w '%{http_code}' -H 'host: reports.example.com' "$live/$1"; }
          for i in $(seq 1 30); do test "$(get _/viewer.js)" = "200" && break; sleep 1; done
          test "$(get _/viewer.js)" = "200" || { echo "::error::the viewer page's files did not answer"; docker logs pk-viewer; exit 1; }
          test "$(get _/element/index.js)" = "200" || { echo "::error::pivotkit-element's files are not in the image"; docker logs pk-viewer; exit 1; }
          test "$(get example)" = "200" || { echo "::error::the viewer page did not answer 200"; docker logs pk-viewer; exit 1; }
          # no warning that pivotkit-element is missing or outside pivotkit-server's range
          if docker logs pk-viewer 2>&1 | grep -q 'pivotkit-element'; then docker logs pk-viewer; exit 1; fi
      - name: Run it as an operator would, with tokens of your own
        # read-only root, /tmp in memory, no capabilities, no new privileges, the image's own user,
        # the tokens from secret files (docker/pivotkit.secrets.example.json), data read-only,
        # reports in a volume
        run: |
          set -eu
          work="$RUNNER_TEMP/pivotkit"
          mkdir -p "$work/data" "$work/secrets"
          printf 'Region,Product,Customer,Sales\nNorth,A,Alice,10\nSouth,B,Bob,20\nNorth,B,Carol,5\n' > "$work/data/sales.csv"
          # the image makes its own tokens: one line of 43 characters on stdout, without a configuration.
          # ">" gives the files the umask's mode; fine for this runner, and chmod 0644 follows anyway
          # (the docs tell operators to use --file or umask 077)
          docker run --rm --read-only --cap-drop ALL pivotkit:test token new > "$work/secrets/pivotkit_token"
          docker run --rm --read-only --cap-drop ALL pivotkit:test token new > "$work/secrets/pivotkit_export_token"
          test "$(wc -c < "$work/secrets/pivotkit_token")" -eq 44
          chmod 0644 "$work/secrets/"*
          cp docker/pivotkit.secrets.example.json "$work/pivotkit.json"
          docker volume create pivotkit-out
          docker run -d --name pivotkit --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:3333:3333 \
            -v "$work/data:/data:ro" -v "$work/pivotkit.json:/config/pivotkit.json:ro" \
            -v "$work/secrets/pivotkit_token:/run/secrets/pivotkit_token:ro" \
            -v "$work/secrets/pivotkit_export_token:/run/secrets/pivotkit_export_token:ro" \
            -v pivotkit-out:/out -v pivotkit-keys:/var/lib/pivotkit pivotkit:test
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' pivotkit)"
            test "$status" = "healthy" && break
            sleep 2
          done
          docker logs pivotkit
          test "$(docker inspect --format '{{.State.Health.Status}}' pivotkit)" = "healthy"
          test "$(docker inspect --format '{{.Config.User}}' pivotkit:test)" = "10001:10001"
          token="$(cat "$work/secrets/pivotkit_token")"
          export_token="$(cat "$work/secrets/pivotkit_export_token")"
          api=http://localhost:3333/api/v1
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/sources")" = "401"
          curl -fsS -H "authorization: Bearer $token" "$api/sources" | grep -q '"id":"sales"'
          curl -fsS -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"source":"sales","view":{"rows":["Region"],"values":[{"field":"Sales","agg":"sum"}]},"format":"xlsx"}' \
            "$api/views/render" | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"source":"sales","view":{"rows":["Region"],"values":[{"agg":"count"}]},"format":"csv"}' "$api/views/render/file")" = "403"
          curl -fsS -H "authorization: Bearer $export_token" -H 'content-type: application/json' \
            -d '{"source":"sales","view":{"rows":["Region"],"values":[{"agg":"count"}]},"format":"csv"}' \
            "$api/views/render/file" | grep -q North
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{}' http://localhost:3333/mcp)" = "401"
          curl -fsS http://localhost:3333/readyz | grep -q '"ok":true'
          # token show inside the running container gives the value the server reads (the docs' kubectl exec line)
          test "$(docker exec pivotkit pivotkit-server token show reports)" = "$token"
          # the configuration names its tokens: no token admin is made
          if docker logs pivotkit 2>&1 | grep -q 'created the token'; then exit 1; fi
          # the report was written to the volume by the image's user
          docker run --rm -v pivotkit-out:/out --entrypoint /nodejs/bin/node pivotkit:test -e "const f=require('fs').readdirSync('/out');console.log(f);if(!f.some(n=>n.endsWith('.xlsx')))process.exit(1)"
          docker run --rm pivotkit:test cli --version
          docker run --rm pivotkit:test mcp --version
          docker run --rm --read-only -v "$work/data:/data:ro" pivotkit:test cli describe /data/sales.csv | grep -q Region
          docker stop --time 30 pivotkit
          test "$(docker inspect --format '{{.State.ExitCode}}' pivotkit)" = "0"
          docker rm pivotkit
      - name: The Compose example
        # docker/compose.example.yml and docker/pivotkit.example.json as the docs use them: the image
        # tagged as the example names it, the token read with docker compose exec
        run: |
          set -eu
          work="$RUNNER_TEMP/compose"
          mkdir -p "$work/data"
          cp docker/compose.example.yml "$work/compose.yml"
          cp docker/pivotkit.example.json "$work/pivotkit.json"
          chmod 0644 "$work/pivotkit.json"
          printf 'Region,Product,Sales\nNorth,A,10\nSouth,B,20\n' > "$work/data/sales.csv"
          docker tag pivotkit:test ghcr.io/eizedev/pivotkit:ci
          cd "$work"
          export PIVOTKIT_VERSION=ci
          docker compose up -d --wait || { docker compose logs; exit 1; }
          token="$(docker compose exec -T pivotkit pivotkit-server token show admin)"
          test "${#token}" -eq 43
          curl -fsS -H "authorization: Bearer $token" http://localhost:3333/api/v1/sources | grep -q '"id":"sales"'
          curl -fsS -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"source":"sales","view":{"rows":["Region"],"values":[{"agg":"count"}]},"format":"csv"}' \
            http://localhost:3333/api/v1/views/render | grep -q '"ok":true'
          # the file route needs the example's policy.results: it fails when the example loses it
          curl -fsS -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"source":"sales","view":{"rows":["Region"],"values":[{"agg":"count"}]},"format":"csv"}' \
            http://localhost:3333/api/v1/views/render/file | grep -q '^North,'
          docker compose down

  publish:
    if: github.event_name == 'push' && vars.IMAGE_RELEASE_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # to find the CI run of the tagged commit
      actions: read
      # to push the image and its attestations to GHCR
      packages: write
      # the OIDC token for cosign's keyless signature
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag matches pivotkit-server's version, on main, CI passed
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./packages/pivotkit-server/package.json').version")"
          test "$TAG" = "pivotkit-server@$version" || { echo "tag $TAG does not match pivotkit-server@$version"; exit 1; }
          # a pre-release would take the stable tags <version> and <major>.<minor>
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$version is a pre-release: no image"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
          runs="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=1" --jq '.total_count')"
          test "$runs" -gt 0 || { echo "no successful CI run for $GITHUB_SHA"; exit 1; }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=^pivotkit-server@(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=^pivotkit-server@(\d+\.\d+)\.\d+$,group=1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The version is not published yet
        # a release is never replaced: a tag pushed again would move <version> and <major>.<minor>.
        # Signed in, so a private package answers too; only "not found" means not published, any other
        # failure of the registry stops the job rather than overwrite the tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#pivotkit-server@}"
          if out="$(docker buildx imagetools inspect "$IMAGE:$version" 2>&1)"; then echo "$IMAGE:$version exists already"; exit 1; fi
          if ! grep -qiE 'not found|manifest unknown|name unknown' <<< "$out"; then echo "the registry did not say whether $IMAGE:$version exists: $out"; exit 1; fi
      - name: Build and push (linux/amd64, linux/arm64) with provenance and SBOM
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: The pushed image starts on both platforms
        # the test job ran linux/amd64; arm64 is built under QEMU, so it is started here once
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$IMAGE@$DIGEST" --version
            docker run --rm --platform "$platform" "$IMAGE@$DIGEST" mcp --version
          done
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        # the digest, not a tag: a tag can be moved, the signature names what was built
        run: cosign sign --yes "$IMAGE@$DIGEST"
