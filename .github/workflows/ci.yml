name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# a newer push to the same branch or pull request replaces the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # the maintained Node LTS lines
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        # no install scripts: nothing here needs one, and a hijacked dependency could run one
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Types
        # type check of the JSDoc sources, generated .d.ts, and a TypeScript consumer compiled against them
        run: npm run types
      - name: Unit tests with coverage
        run: npm run coverage
      - name: Repository checks
        # the Playwright image matches the locked @playwright/test, every dependency is pinned
        run: node --test "tests/*.test.js"
      - name: Package contents
        # npm pack --dry-run: LICENSE, docs, sources and types in the tarball; publishes nothing
        run: npm run pack:check
      - name: Audit
        run: npm audit --audit-level=high
      - name: Benchmark
        # timings for the log only: shared runners vary too much for a threshold
        if: matrix.node == '24'
        run: npm run bench -w pivotkit-core

  browser:
    # The playground (examples/playground) in Chromium, Firefox and WebKit. Playwright's own image
    # carries the browsers and their system libraries, so nothing is installed with apt. Its version
    # must be the one of @playwright/test in package-lock.json; tests/ci.test.js checks that.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Browser tests
        # builds the package and the playground, then runs tests/browser against the static build
        run: npm run test:browser
      - name: Playground build
        # the static files the tests opened, to try the playground without building it
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground
          path: examples/playground/dist/
          retention-days: 14
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
