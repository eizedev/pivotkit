name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# a newer push to the same branch or pull request replaces the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # the maintained Node LTS lines
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        # no install scripts: nothing here needs one, and a hijacked dependency could run one
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Types
        # type check of the JSDoc sources, generated .d.ts, and a TypeScript consumer compiled against them
        run: npm run types
      - name: Unit tests with coverage
        run: npm run coverage
      - name: Package contents
        # npm pack --dry-run: LICENSE, docs, sources and types in the tarball; publishes nothing
        run: npm run pack:check
      - name: Audit
        run: npm audit --audit-level=high
      - name: Benchmark
        # timings for the log only: shared runners vary too much for a threshold
        if: matrix.node == '24'
        run: npm run bench -w pivotkit-core
