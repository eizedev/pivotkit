name: CI

on:
  push:
    branches: ["main"]
  # every base branch: a pull request stacked on another one is tested too
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or pull request replaces the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # the maintained Node LTS lines
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        # no install scripts: nothing here needs one, and a hijacked dependency could run one
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Registry signatures
        # every installed package carries the registry's signature (and its attestation where it has one)
        run: npm audit signatures
      - name: Lint
        run: npm run lint
      - name: Types
        # type check of the JSDoc sources, generated .d.ts, and a TypeScript consumer compiled against them
        run: npm run types
      - name: Temporary directories before the tests
        # the pivotkit-* names already there, for the check after the repository checks. Linux only:
        # the windows job does not run it
        run: node scripts/temp-dirs.js save "$RUNNER_TEMP/temp-dirs.json"
      - name: Unit tests with coverage
        run: npm run coverage
      - name: Repository checks
        # the Playwright image matches the locked @playwright/test, every dependency is pinned; a run
        # that leaves a temporary directory behind fails (scripts/test-run.js)
        run: node scripts/test-run.js node --test "tests/*.test.js"
      - name: No temporary directory left behind
        # of any run or process: one killed without its exit event, or started without the run's id.
        # A directory a sweep of tempDir() removed during the tests fails it too
        run: node scripts/temp-dirs.js check "$RUNNER_TEMP/temp-dirs.json"
      - name: Package contents
        # npm pack --dry-run: LICENSE, docs, sources and types in the tarball; publishes nothing
        run: npm run pack:check
      - name: Audit
        run: npm audit --audit-level=high
      - name: Benchmark
        # timings for the log only: shared runners vary too much for a threshold
        if: matrix.node == '24'
        run: npm run bench -w pivotkit-core
      - name: Web component size
        # what a page loads (first, on the first chart, on the first export), gzip, for the log
        if: matrix.node == '24'
        run: npm run size -w pivotkit-element
      - name: Excel reader size
        # pivotkit-xlsx's dist/: the plugin's descriptor and the reader it loads, gzip; fails above its budget
        if: matrix.node == '24'
        run: npm run size -w pivotkit-xlsx

  platforms:
    # pivotkit-cli and pivotkit-server on Windows and macOS; the other jobs run on Linux. Windows:
    # drive letters, junctions (reparse points), no O_NOFOLLOW, no POSIX modes. macOS: its own file
    # system and signals. The server's tests cover the workers, the output directory, download
    # markers (hard links), listen, the state directory, sign-in and the secret files. On Windows,
    # the tests of file modes, owners, FIFOs, symbolic links and a caught SIGTERM skip themselves or
    # check what Windows does instead
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build
        run: npm run build
      - name: pivotkit-cli tests
        run: npm test -w pivotkit-cli
      - name: pivotkit-server tests
        run: npm test -w pivotkit-server

  angular:
    # The Angular example (examples/angular): a standalone component with <pivot-report>, built by
    # Angular's CLI from its own lock file against this repository's pivotkit-element (linked from
    # packages/), then one Playwright test in Chromium, Firefox and WebKit. The same Playwright image
    # as the browser jobs (tests/ci.test.js checks every image in this file).
    name: angular
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build pivotkit-element
        # its dist/ and its types/ (the example imports the PivotView type)
        run: npm run types && node packages/pivotkit-element/build.js
      - name: Install the Angular example
        run: npm ci --prefix examples/angular --no-audit --no-fund --ignore-scripts
      - name: Build the Angular example
        # a warning fails the step: an Angular app should build pivotkit-element without one
        shell: bash
        working-directory: examples/angular
        env:
          NG_CLI_ANALYTICS: "false"
        run: npm run build 2>&1 | tee build.log && ! grep -q "WARNING" build.log
      - name: Browser test
        run: npx playwright test -c examples/angular/playwright.config.js
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-angular
          path: |
            examples/angular/playwright-report/
            examples/angular/test-results/
          retention-days: 14

  browser:
    # The playground (examples/playground), the host pages and the web component's pages
    # (tests/browser/pages) in Chromium, Firefox and WebKit, on React 18 (the workspace's, as
    # PowerShell Universal provides it) and on React 19 (tests/react19, its own lock file). One job per
    # engine, shard and React version, so a failure names its engine. Shards keep each job's tests near
    # 8 minutes, half of its timeout: one Chromium or three WebKit shards ran up to 14.3 minutes (#627)
    # Playwright's own image carries the browsers and their system libraries, so nothing is installed
    # with apt. Its version must be the one of @playwright/test in package-lock.json; tests/ci.test.js
    # checks that and this matrix.
    name: browser (${{ matrix.target.browser }} ${{ matrix.target.shard }}/${{ matrix.target.of }}, React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react: ["18", "19"]
        target:
          - { browser: chromium, shard: 1, of: 2 }
          - { browser: chromium, shard: 2, of: 2 }
          - { browser: firefox, shard: 1, of: 2 }
          - { browser: firefox, shard: 2, of: 2 }
          - { browser: webkit, shard: 1, of: 4 }
          - { browser: webkit, shard: 2, of: 4 }
          - { browser: webkit, shard: 3, of: 4 }
          - { browser: webkit, shard: 4, of: 4 }
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Install React 19
        if: matrix.react == '19'
        run: npm ci --prefix tests/react19 --no-audit --no-fund --ignore-scripts
      - name: Build
        # the packages, the playground and the test pages, on the job's React
        env:
          PIVOTKIT_REACT: ${{ matrix.react }}
        run: npm run build:playground
      - name: React 19 types
        if: matrix.react == '19'
        # Generate declarations in workspace build order, then resolve the consumer's React from
        # tests/react19 via tsconfig paths, never from the React 18 workspace install.
        run: npm run types && npm run types --prefix tests/react19
      - name: Browser tests
        # tests/browser against the build, in the job's engine and shard only; a run that leaves a
        # temporary directory behind fails (scripts/test-run.js)
        env:
          PIVOTKIT_REACT: ${{ matrix.react }}
        run: node scripts/test-run.js npx playwright test --project=${{ matrix.target.browser }} --shard=${{ matrix.target.shard }}/${{ matrix.target.of }}
      - name: Playground build
        # the static files the tests opened, to try the playground without building it
        if: success() && matrix.react == '18' && matrix.target.browser == 'chromium'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground
          path: examples/playground/dist/
          retention-days: 14
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.target.browser }}-${{ matrix.target.shard }}-of-${{ matrix.target.of }}-react-${{ matrix.react }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
