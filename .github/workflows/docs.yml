name: Docs site

# Builds the documentation site (pivotkit.eize.dev) on every pull request and push to main, so it never
# breaks unnoticed, and publishes it to GitHub Pages only for a release: when a GitHub release is
# published, or by hand with the input "tag" (Actions > Docs site > Run workflow, e.g.
# pivotkit-react@0.1.1). So the site always describes what npm has, not unreleased changes on main.
# A published release builds the newest release tag on main, whichever release started the run: the
# releases of several packages (one commit, or a later one) all build the same pages, so the order in
# which their runs finish cannot leave an older site. The
# github-pages environment allows main and the release tags (pivotkit-*@*) to deploy. `npm run docs:demo` builds the playground and
# copies it into docs/playground/ (the live demo); then Zensical builds the pages with the shared design
# of eizedev/brand. Publishing runs only when the repository variable PAGES_ENABLED is "true"
# (Settings > Pages > Source: GitHub Actions; the custom domain is set there too). GitHub Pages needs the
# repository to be public on GitHub Free, so until then the build runs and the deploy is skipped.

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the site from (e.g. pivotkit-react@0.1.1), or main for a preview"
        required: true

permissions:
  contents: read

# a release of several packages publishes several releases: one publication at a time, the last one
# wins, and every one of them builds the newest release tag
concurrency:
  group: docs-${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && 'publish' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # a run by hand publishes only a release tag that exists, or main as a preview: never another
      # branch, which would put unreviewed pages on the site (the environment checks only the ref the
      # workflow runs on, not what it checks out)
      - name: Check the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ "$TAG" = main ]; then exit 0; fi
          if ! [[ "$TAG" =~ ^pivotkit-(core|react|element|xlsx|report|cli)@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be a release tag such as pivotkit-react@0.2.0, or main"; exit 1
          fi
          git ls-remote --exit-code --tags "$REPO" "refs/tags/$TAG" > /dev/null || { echo "::error::no tag $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # a run by hand builds the tag it names; everything else its own ref (a release: below)
          ref: ${{ inputs.tag || github.ref }}
          # a release reads the tags and main to find the newest release
          fetch-depth: ${{ github.event_name == 'release' && '0' || '1' }}
      - name: Newest release
        if: github.event_name == 'release'
        # the release tag nearest to main's head: every package's tags of one release sit on one commit,
        # and release.yml publishes only commits on main
        env:
          STARTED_BY: ${{ github.event.release.tag_name }}
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'pivotkit-*@*' origin/main)"
          echo "Building $tag (the run was started by the release $STARTED_BY)"
          git checkout --quiet --detach "refs/tags/$tag"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        # no install scripts, as in ci.yml
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Live demo
        run: npm run docs:demo
      # the shared design and the pinned Zensical version (eizedev/brand, docs-site/); the site lands in site/
      - uses: eizedev/brand/docs-site@c68d7f551c57943f66f5f68f49856d52c33a1550 # main
      # the npm READMEs link into the site; a published README cannot change, so its links must resolve
      - name: README links
        run: node scripts/check-readme-links.js site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
