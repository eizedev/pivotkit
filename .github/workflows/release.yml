name: Release

# Prepared, not active. Publishes a package of this repository (pivotkit-core, pivotkit-react or
# pivotkit-element) to npm with provenance when a tag <package>@<version> is pushed, but only after
# the maintainer has
#   1. created the package on npm and set up trusted publishing for this repository and workflow,
#   2. created the GitHub environment "npm" with required reviewers,
#   3. set the repository variable NPM_RELEASE_ENABLED to "true".
# Until then every run is skipped. See CONTRIBUTING.md, "Releasing".
on:
  push:
    tags: ["pivotkit-core@*", "pivotkit-react@*", "pivotkit-element@*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: vars.NPM_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # OIDC token for npm trusted publishing and the provenance attestation; no npm token is stored
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Tag matches the package version
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%@*}"
          case "$name" in
            pivotkit-core|pivotkit-react|pivotkit-element) ;;
            *) echo "tag $TAG names no package of this repository"; exit 1 ;;
          esac
          version="$(node -p "require('./packages/$name/package.json').version")"
          test "$TAG" = "$name@$version" || { echo "tag $TAG does not match $name@$version"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Lint, types, tests
        run: npm run lint && npm run types && npm test
      - name: Package contents
        run: npm run pack:check
      - name: Publish
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
        run: npm publish --workspace "$PACKAGE" --provenance --access public
