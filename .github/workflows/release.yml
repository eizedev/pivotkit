name: Release

# Stages a package of this repository (pivotkit-core, pivotkit-react, pivotkit-element,
# pivotkit-xlsx, pivotkit-report, pivotkit-node, pivotkit-cli, pivotkit-server or pivotkit-mcp) on npm with
# provenance when a tag <package>@<version> is pushed; a maintainer approves the staged version on
# npm with two-factor authentication before it is published. It needs trusted publishing on npm for
# this workflow and the environment "npm" (staging only), the GitHub environment "npm" with required
# reviewers, and the repository variable NPM_RELEASE_ENABLED set to "true" (RELEASING.md, "One-time
# setup"). Without that variable every run is skipped.
#
# Two jobs:
# - "build" has no publishing right. It installs, packs and checks; the dependencies run here.
# - "publish" gets the OIDC token. It installs nothing and stages the tarball "build" made.
# "build" packs and uploads the tarball before lint and tests run. Only the compilers and bundlers
# run before the pack: tsc and the package's prepack. "publish" stages only a tarball with the
# integrity the Pack step recorded.
on:
  push:
    tags: ["pivotkit-core@*", "pivotkit-react@*", "pivotkit-element@*", "pivotkit-xlsx@*", "pivotkit-report@*", "pivotkit-node@*", "pivotkit-cli@*", "pivotkit-server@*", "pivotkit-mcp@*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: vars.NPM_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # to find the CI run of the tagged commit
      actions: read
    outputs:
      tarball: ${{ steps.pack.outputs.file }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the whole history, for the check that the tag is on main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Tag matches the package version
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%@*}"
          case "$name" in
            pivotkit-core|pivotkit-react|pivotkit-element|pivotkit-xlsx|pivotkit-report|pivotkit-node|pivotkit-cli|pivotkit-server|pivotkit-mcp) ;;
            *) echo "tag $TAG names no package of this repository"; exit 1 ;;
          esac
          version="$(node -p "require('./packages/$name/package.json').version")"
          test "$TAG" = "$name@$version" || { echo "tag $TAG does not match $name@$version"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
      - name: Own dependencies are released
        # a package of this repository it depends on has no unreleased CHANGELOG entry and is on npm at
        # the version in this commit: else this one was tested against code npm does not have (#206)
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
        run: node scripts/check-release.js "$PACKAGE" --published
      - name: CI passed for the tagged commit
        # a push run of ci.yml: only that one holds the browser matrix (browser.yml); a pull request
        # run does not. A release needs its green run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          runs="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=1" --jq '.total_count')"
          test "$runs" -gt 0 || { echo "no successful CI run for $GITHUB_SHA"; exit 1; }
      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Registry signatures
        # every installed package carries the registry's signature (and its attestation where it has one);
        # an answer of the registry that cannot be read is tried again (scripts/audit-signatures.js)
        run: node scripts/audit-signatures.js
      - name: Types
        # every workspace's declarations, in build order: a package's types import its dependencies'
        # (pivotkit-react's do not compile without them). tsc only; lint and tests run after the pack
        run: npm run types --workspaces --if-present
      - name: Pack
        # before lint and tests: only tsc and the package's prepack (its build) have run yet
        id: pack
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
        run: |
          # a failing npm pack or a refused file name fails the step, not only the pipe's last command
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          # the JSON with the file name goes to stdout; scripts/npm-pack.js reads it in the shape of any npm version
          file="$(npm pack --workspace "$PACKAGE" --pack-destination "$RUNNER_TEMP/pack" --json | node scripts/npm-pack.js)"
          test -f "$RUNNER_TEMP/pack/$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          # npm's form (dist.integrity): sha512, base64
          echo "integrity=sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/pack/$file" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/pack/${{ steps.pack.outputs.file }}
          if-no-files-found: error
          retention-days: 7
      - name: Lint, types, tests
        run: npm run lint && npm run types && npm test
      - name: Package contents
        run: npm run pack:check

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      # OIDC token for npm trusted publishing and the provenance attestation; no npm token is stored
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # trusted publishing needs Node 22.14.0 or later
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm for trusted publishing
        # staged publishing needs npm 11.15.0 or later (npm's documentation, "Staged publishing");
        # one pinned version instead of whatever ships with the runner's Node
        run: |
          npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
          npm --version
      - name: Tarball is the one the Pack step made
        # the integrity was recorded right after the pack, before lint, types and tests ran
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: |
          actual="sha512-$(openssl dgst -sha512 -binary "pack/$TARBALL" | base64 -w0)"
          test "$actual" = "$INTEGRITY" || { echo "tarball has $actual, the Pack step recorded $INTEGRITY"; exit 1; }
      - name: Tarball matches the tag
        env:
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        # read the package.json inside the tarball itself, not the one in the repository
        run: |
          actual="$(tar -xOzf "pack/$TARBALL" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);console.log(p.name+"@"+p.version)})')"
          test "$actual" = "$TAG" || { echo "tarball holds $actual, tag is $TAG"; exit 1; }
      - name: Stage on npm (not live until a maintainer approves it in the Staged Packages tab on npmjs.com)
        env:
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
        # the tarball only: nothing of the repository is installed or run in this job, and no
        # lifecycle script of the tarball runs while the OIDC token is available. The path starts
        # with ./ : npm reads "pack/<file>" as the GitHub repository <owner>/<repo>. The trusted
        # publisher allows staging only ("Allow npm publish" unchecked): the version goes live when a
        # maintainer approves it with two-factor authentication, which no token of this workflow can do
        run: |
          set -o pipefail
          npm stage publish "./pack/$TARBALL" --provenance --access public --ignore-scripts 2>&1 | tee stage.log
          # the stage id, if npm prints it as "(staged with id <id>)"; unverified, so the summary
          # does not rely on it
          id="$(grep -o 'staged with id [^)]*' stage.log | head -n 1 | sed 's/^staged with id //' || true)"
          {
            echo "## $TAG is staged on npm, not published"
            echo
            echo "Tarball: \`$TARBALL\`, integrity \`$INTEGRITY\` (packed before lint, types and tests ran)."
            echo
            echo "Nobody can install it until a maintainer approves it with two-factor authentication:"
            echo
            echo "- on npmjs.com: sign in, open the Staged Packages tab in the account settings, review ${TAG%@*} and click Approve"
            if [ -n "$id" ]; then
              echo "- or from the command line: \`npm stage approve $id\`"
            else
              echo "- or from the command line: \`npm stage list ${TAG%@*}\` shows the stage id, then \`npm stage approve <stage-id>\`"
            fi
            echo
            echo "If nobody approves it, the version never goes live on npm: the next tag that depends"
            echo "on it fails in its build job, and the GitHub release for $TAG waits. To drop it instead,"
            echo "click Reject on npmjs.com or run \`npm stage reject <stage-id>\`."
            echo
            # a tilde fence: npm's output cannot close it with a line of backticks
            echo '~~~~'
            cat stage.log
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"
