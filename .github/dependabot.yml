version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # a just-published release has had no time for anyone to notice if it is malicious or broken
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: "npm"
    # one lock file at the root covers every workspace package
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"
    groups:
      eslint:
        patterns: ["eslint", "@eslint/*", "globals"]
  - package-ecosystem: "npm"
    # React 19 for the browser tests: its own lock file, outside the workspaces
    directory: "/tests/react19"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"
