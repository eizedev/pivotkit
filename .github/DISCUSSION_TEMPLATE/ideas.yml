body:
  - type: markdown
    attributes:
      value: |
        Share an idea for pivotkit. Ideas that take shape become issues.
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The task or the problem, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: A workaround, another tool, or not at all.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How pivotkit could help. Sketches and screenshots are welcome.
